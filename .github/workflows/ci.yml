name: CI - AutoReparos.App

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore AutoReparos.App.slnx
      - run: dotnet build AutoReparos.App.slnx --no-restore -c Release
      - run: dotnet test AutoReparos.App.slnx --no-build -c Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AutoReparos.Web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1e60f620b9541d0f1a2e9f6dce3b2bb6d79e3d6a # v4.0.3
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: AutoReparos.Web/yarn.lock
      - run: corepack enable && yarn install --frozen-lockfile
      - run: yarn build
