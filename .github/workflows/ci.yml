name: CI - AutoReparos.App

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.dockerignore'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.dockerignore'

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22'

jobs:
  backend-build-test:
    name: Compilação e Testes (Backend .NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore Dependencies
        run: dotnet restore AutoReparos.App.slnx

      - name: Build Application
        run: dotnet build AutoReparos.App.slnx --no-restore -c Release

      - name: Run Unit Tests (Domain)
        run: dotnet test AutoReparos.Domain.Tests/AutoReparos.Domain.Tests.csproj --no-build -c Release --logger "trx;LogFileName=domain-results.trx"

      - name: Run Unit Tests (Application)
        run: dotnet test AutoReparos.Application.Tests/AutoReparos.Application.Tests.csproj --no-build -c Release --logger "trx;LogFileName=application-results.trx"

      - name: Run Integration Tests (Testcontainers)
        run: dotnet test AutoReparos.IntegrationTests/AutoReparos.IntegrationTests.csproj --no-build -c Release --logger "trx;LogFileName=integration-results.trx"

  frontend-build:
    name: Compilação e Testes (Frontend Angular 19)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: AutoReparos.Web/yarn.lock

      - name: Install Dependencies
        working-directory: AutoReparos.Web
        run: yarn install --frozen-lockfile

      - name: Build Angular Application
        working-directory: AutoReparos.Web
        run: yarn build

      - name: Run Frontend Tests
        working-directory: AutoReparos.Web
        run: yarn test --watch=false
