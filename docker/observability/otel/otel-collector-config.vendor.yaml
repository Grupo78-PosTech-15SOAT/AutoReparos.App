# Overlay opcional de exportacao para o backend de observabilidade em nuvem (New Relic).
#
# Este arquivo NAO substitui o otel-collector-config.yaml: o OTel Collector aceita
# multiplos "--config" e faz merge profundo entre eles. O overlay apenas ACRESCENTA o
# exportador otlp/newrelic aos pipelines, preservando Jaeger, Loki e Prometheus locais.
#
# Para habilitar, defina no .env:
#   NEW_RELIC_LICENSE_KEY=<sua-license-key>
#   OTEL_VENDOR_CONFIG_ARG=--config=/etc/otel-collector-config.vendor.yaml
#
# Para Datadog, troque o bloco otlp/newrelic por:
#   otlp/datadog:
#     endpoint: https://otlp.datadoghq.com:4317
#     headers:
#       dd-api-key: ${env:DD_API_KEY}

exporters:
  otlp/newrelic:
    endpoint: otlp.nr-data.net:4317
    headers:
      api-key: ${env:NEW_RELIC_LICENSE_KEY}
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
    sending_queue:
      enabled: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, transform, batch]
      exporters: [otlp/jaeger, otlp/newrelic]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus, otlp/newrelic]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [loki, otlp/newrelic]
